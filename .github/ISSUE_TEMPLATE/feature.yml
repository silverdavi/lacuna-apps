name: Feature
description: A feature request for an app or the toolbox.
title: "[feature] "
labels: ["feature"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What the app or the toolbox should do, and who else can use it.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Your guess at how big this is.
      options:
        - Small
        - Medium
        - Large
    validations:
      required: false
  - type: input
    id: app
    attributes:
      label: App slug
      description: Leave blank if this is about the toolbox or the shelf.
      placeholder: receipt-packet
    validations:
      required: false
