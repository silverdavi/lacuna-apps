<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Vehicle Mileage Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Patch clipboard so readText works without explicit permission (test env).
      const _nc = navigator.clipboard
      if (_nc) {
        let _store = ''
        const origWrite = _nc.writeText?.bind(_nc)
        _nc.writeText = async (t) => { _store = t; if (origWrite) { try { await origWrite(t) } catch {} } }
        _nc.readText = async () => _store
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
